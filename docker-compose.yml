services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-job_service}
      MYSQL_USER: ${MYSQL_USER:-job_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-job_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./recommend/setup.sql:/docker-entrypoint-initdb.d/01-recommend.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-job_service}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-job_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-job_password}
      JWT_ACCESS_KEY: ${JWT_ACCESS_KEY:-replace-this-access-key-with-at-least-64-random-characters-1234567890}
      JWT_REFRESH_KEY: ${JWT_REFRESH_KEY:-replace-this-refresh-key-with-at-least-64-random-characters-12345678}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RECOMMENDATION_SERVICE_URL: http://recommend:8000
      FILE_UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  recommend:
    build:
      context: ./recommend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-job_user}:${MYSQL_PASSWORD:-job_password}@mysql:3306/${MYSQL_DATABASE:-job_service}?charset=utf8mb4
      MODEL_DIMENSIONS: 384
    ports:
      - "8000:8000"
    volumes:
      - recommendation_artifacts:/app/model_artifacts

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  backend_uploads:
  recommendation_artifacts:
